<div class="notif-trigger">
    <button class="btn-icon btn-ghost position-relative" type="button" title="Notifications">
        <i class="bi bi-bell fs-6"></i>
        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
    </button>
    <div class="notif-panel" id="notifPanel" style="display:none;">
        <div class="notif-head">
            <strong>Notifications</strong>
            <a href="#" onclick="event.preventDefault();fetch('/notifications/mark_all_read',{method:'POST',headers:{'X-CSRFToken':'{{ csrf_token() }}'}}).then(function(){var l=document.getElementById('notifList');if(l)l.innerHTML='<div class=\\'text-center text-muted py-4\\' style=\\'font-size:.8rem;\\'>No notifications</div>';var b=document.getElementById('notifBadge');if(b)b.style.display='none';});" class="text-primary" style="font-size:.75rem;font-weight:600;">Mark all read</a>
        </div>
        <div class="notif-list" id="notifList">
            <div class="text-center text-muted py-4" style="font-size:.8rem;">Loading...</div>
        </div>
        <div class="notif-foot">
            <a href="{{ url_for('main.notification_list') }}" style="font-size:.8rem;font-weight:600;color:var(--primary);">View all notifications</a>
        </div>
    </div>
</div>
