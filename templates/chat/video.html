<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Consultation | HMS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: 'Inter', sans-serif; background: #0f1b2d; }
        .video-topbar {
            background: #1a2433; color: white; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .video-topbar h5 { margin: 0; font-size: 1rem; }
        .btn-outline-light2 { border: 1px solid rgba(255,255,255,0.3); color: white; background: transparent; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-outline-light2:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-danger2 { border: none; background: #e74c3c; color: white; border-radius: 8px; padding: 8px 18px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-danger2:hover { background: #c0392b; }
        #jitsi-container { flex: 1; }
        .status-banner { text-align: center; padding: 6px; font-size: 0.8rem; color: #00c9a7; background: rgba(0,201,167,0.1); border-bottom: 1px solid rgba(0,201,167,0.2); }
    </style>
</head>
<body>
    <div class="video-topbar">
        <div>
            <h5><i class="bi bi-camera-video-fill me-2"></i>Video Consultation - Appointment #{{ appointment.id }}</h5>
            <small style="opacity:0.6;">{{ appointment.patient.user.full_name }} with Dr. {{ appointment.doctor.user.full_name }}</small>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a href="{{ url_for('main.chat_room', appointment_id=appointment.id) }}" class="btn-outline-light2">
                <i class="bi bi-chat-dots-fill"></i> Chat
            </a>
            <button class="btn-danger2" onclick="endCall()"><i class="bi bi-telephone-x-fill"></i> End Call</button>
        </div>
    </div>
    <div class="status-banner" id="statusBanner">
        <i class="bi bi-circle-fill" style="font-size:0.5rem;"></i>
        <span id="statusText">{% if video.status == 'ended' %}This call has ended.{% else %}Starting secure video call...{% endif %}</span>
    </div>
    <div id="jitsi-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const roomName = '{{ video.room_name }}';
        const appointmentId = {{ appointment.id }};
        const csrfToken = '{{ csrf_token() }}';
        const currentUserName = '{{ current_user.full_name }}';
        const videoStatus = '{{ video.status }}';

        let api = null;
        let endedByUser = false;

        function initJitsi() {
            if (videoStatus === 'ended') {
                document.getElementById('statusText').textContent = 'This call has already ended.';
                return;
            }
            const domain = 'meet.jit.si';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: currentUserName },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: ['microphone','camera','closedcaptions','desktop','fullscreen','fodeviceselection','hangup','profile','chat','recording','livestreaming','etherpad','sharedvideo','settings','raisehand','videoquality','filmstrip','invite','feedback','stats','shortcuts','tileview','select-background','download','embedmeeting','mute-everyone'],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    DEFAULT_BACKGROUND: '#0f1b2d'
                }
            };
            api = new JitsiMeetExternalAPI(domain, options);

            // Mark call active when a participant joins
            fetch('/video/' + appointmentId + '/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({})
            }).catch(() => {});

            api.addListener('videoConferenceLeft', function() {
                endCall();
            });
        }

        function endCall() {
            if (endedByUser) return;
            endedByUser = true;
            fetch('/video/' + appointmentId + '/end', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({})
            }).finally(function() {
                document.getElementById('statusText').textContent = 'Call ended. You can close this window.';
                if (api) {
                    try { api.dispose(); } catch(e) {}
                }
            });
        }

        window.addEventListener('beforeunload', function() {
            if (!endedByUser) {
                navigator.sendBeacon('/video/' + appointmentId + '/end',
                    new Blob([JSON.stringify({})], {type: 'application/json'}));
            }
        });

        window.addEventListener('load', initJitsi);
    </script>
</body>
</html>
