<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | HMS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        body { font-family: var(--font-body); background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; overflow: hidden; }
        .error-shell { position: relative; padding: var(--space-8); }
        .blob-a { width: 300px; height: 300px; background: rgba(37,99,235,0.2); top: -80px; left: -80px; }
        .blob-b { width: 260px; height: 260px; background: rgba(6,182,212,0.2); bottom: -80px; right: -60px; animation-delay: 5s; }
        .error-code { font-family: var(--font-heading); font-size: clamp(5rem, 16vw, 9rem); font-weight: 800; color: var(--primary); line-height: 1; }
        .error-title { font-family: var(--font-heading); font-size: var(--text-2xl); font-weight: 700; margin-bottom: var(--space-2); }
        .error-desc { color: var(--text-muted); margin-bottom: var(--space-6); }
    </style>
</head>
<body>
    <div class="error-shell position-relative">
        <div class="blob blob-a"></div>
        <div class="blob blob-b"></div>
        <div class="position-relative" style="z-index:2;">
            <div class="error-code">404</div>
            <div class="error-title">Page not found</div>
            <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
            <a href="/" class="btn btn-primary btn-lg"><i class="bi bi-house me-2"></i>Back to Home</a>
        </div>
    </div>
</body>
</html>
